<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Computer Explorer</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="loading">
    <div class="loader"></div>
    <h2>AR Computer Explorer</h2>
    <p>Starting camera...</p>
  </div>

  <div id="instructions" class="panel">
    <button id="closeInstructions">×</button>
    <h1>🖥️ AR Computer Explorer</h1>
    <p>Point your phone camera at the <b>Hiro marker</b>.</p>
    <p>When the computer appears, tap the <b>SYSTEM UNIT</b> to open it.</p><p class="small">For phone testing, open the published HTTPS website and allow camera access.</p>
  </div>

  <div id="infoPanel" class="panel hidden">
    <button id="closeInfo">×</button>
    <div id="infoIcon">💻</div>
    <h2 id="infoTitle">Component</h2>
    <p id="infoText">Information</p>
  </div>

  <button id="helpButton">?</button>
  <button id="resetButton">↻ Reset</button>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    gesture-detector
  >
    <a-marker id="computerMarker" preset="hiro">

      <!-- COMPUTER GROUP -->
      <a-entity id="computer" position="0 0.05 0" scale="0.75 0.75 0.75">

        <!-- MONITOR -->
        <a-entity position="0 1.75 0">
          <a-box color="#20252b" width="2.8" height="1.7" depth="0.12"
                 position="0 0 0"></a-box>
          <a-box color="#15181c" width="2.45" height="1.35" depth="0.04"
                 position="0 0 0.08"></a-box>
          <a-box color="#1683ff" width="2.15" height="1.08" depth="0.02"
                 position="0 0 0.11"></a-box>

          <a-text value="AR COMPUTER"
                  align="center"
                  color="white"
                  width="2.2"
                  position="0 0 0.14"></a-text>

          <a-box color="#30363d" width="0.25" height="0.9" depth="0.25"
                 position="0 -1.25 0"></a-box>
          <a-box color="#252a30" width="1.15" height="0.12" depth="0.5"
                 position="0 -1.72 0"></a-box>
        </a-entity>

        <!-- SYSTEM UNIT OUTER CASE -->
        <a-entity id="caseClosed" class="clickable" position="0 0.65 0"
                  data-component="System Unit">

          <a-box color="#2d333b" width="1.65" height="2.0" depth="1.25"></a-box>
          <a-box color="#171b20" width="1.42" height="1.72" depth="0.05"
                 position="0 0 0.64"></a-box>

          <!-- Front buttons -->
          <a-cylinder color="#4aa3ff" radius="0.07" height="0.03"
                      rotation="90 0 0" position="0.48 0.62 0.67"></a-cylinder>
          <a-cylinder color="#9aa4ad" radius="0.05" height="0.03"
                      rotation="90 0 0" position="0.48 0.42 0.67"></a-cylinder>

          <a-text value="SYSTEM UNIT"
                  align="center"
                  color="#dce6ef"
                  width="1.5"
                  position="0 0.05 0.69"
                  rotation="0 0 0"></a-text>
        </a-entity>

        <!-- OPEN INTERNALS -->
        <a-entity id="internals" visible="false" position="0 0.65 0">

          <!-- motherboard -->
          <a-box id="motherboard" class="clickable" color="#145a43"
                 width="1.48" height="1.78" depth="0.08"
                 position="0 0 0.58"
                 data-component="Motherboard"></a-box>

          <!-- CPU -->
          <a-box id="cpu" class="clickable" color="#b9b9b9"
                 width="0.42" height="0.42" depth="0.10"
                 position="-0.35 0.38 0.68"
                 data-component="CPU"></a-box>

          <!-- RAM -->
          <a-box id="ram" class="clickable" color="#d7c44b"
                 width="0.12" height="0.72" depth="0.08"
                 position="0.05 0.25 0.68"
                 data-component="RAM"></a-box>
          <a-box class="clickable" color="#d7c44b"
                 width="0.12" height="0.72" depth="0.08"
                 position="0.22 0.25 0.68"
                 data-component="RAM"></a-box>

          <!-- GPU -->
          <a-box id="gpu" class="clickable" color="#3d72c9"
                 width="0.85" height="0.25" depth="0.13"
                 position="0 -0.35 0.70"
                 data-component="GPU"></a-box>

          <!-- Storage -->
          <a-box id="storage" class="clickable" color="#a9b0b8"
                 width="0.55" height="0.22" depth="0.10"
                 position="-0.36 -0.55 0.68"
                 data-component="Storage"></a-box>

          <!-- PSU -->
          <a-box id="psu" class="clickable" color="#292d32"
                 width="0.68" height="0.48" depth="0.35"
                 position="0.35 -0.55 0.50"
                 data-component="Power Supply"></a-box>

          <!-- Labels -->
          <a-text value="CPU" color="white" width="0.7" position="-0.35 0.38 0.76"></a-text>
          <a-text value="RAM" color="white" width="0.7" position="0.14 0.72 0.76"></a-text>
          <a-text value="GPU" color="white" width="0.7" position="0 -0.08 0.78"></a-text>
          <a-text value="SSD" color="white" width="0.7" position="-0.36 -0.77 0.76"></a-text>
          <a-text value="PSU" color="white" width="0.7" position="0.35 -0.84 0.76"></a-text>
          <a-text value="MOTHERBOARD" color="white" width="1.8"
                  position="0 0.92 0.72"></a-text>
        </a-entity>

        <!-- FLOOR -->
        <a-cylinder color="#1683ff" radius="1.6" height="0.025"
                    position="0 -0.4 0" opacity="0.45"></a-cylinder>
      </a-entity>

    </a-marker>

    <a-entity camera cursor="rayOrigin: mouse"></a-entity>
  </a-scene>

  <script src="script.js"></script>
</body>
</html>
