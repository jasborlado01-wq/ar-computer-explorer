<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AR Computer Explorer</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #title {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            background: rgba(10, 15, 22, 0.88);
            color: white;

            padding: 12px 22px;
            border-radius: 15px;

            font-size: 19px;
            font-weight: bold;
            text-align: center;

            white-space: nowrap;
        }

        #instruction {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            background: rgba(0, 0, 0, 0.78);
            color: white;

            padding: 10px 16px;
            border-radius: 12px;

            font-size: 13px;
            text-align: center;
        }

        #infoPanel {
            display: none;

            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);

            width: 86%;
            max-width: 420px;

            z-index: 20;

            background: rgba(12, 18, 25, 0.96);
            color: white;

            padding: 18px;
            border-radius: 18px;

            text-align: center;
        }

        #infoPanel h2 {
            color: #35d9ff;
            margin: 0 0 10px;
        }

        #infoPanel p {
            line-height: 1.5;
            margin: 0;
        }

        #closeInfo {
            margin-top: 15px;
            padding: 9px 24px;

            border: none;
            border-radius: 10px;

            background: #35d9ff;
            color: #111;

            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="title">
        🖥️ AR COMPUTER EXPLORER
    </div>

    <div id="infoPanel">
        <h2 id="componentTitle">Computer Component</h2>

        <p id="componentDescription">
            Component information
        </p>

        <button id="closeInfo">
            CLOSE
        </button>
    </div>

    <div id="instruction">
        📷 Scan the HIRO marker
    </div>


    <!-- ============================== -->
    <!-- AR SCENE -->
    <!-- ============================== -->

    <a-scene
        embedded
        vr-mode-ui="enabled: false"

        renderer="
            antialias: true;
            alpha: true;
            precision: highp;
        "

        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
            trackingMethod: best;
        "

        device-orientation-permission-ui="enabled: false"
    >

        <!-- ============================== -->
        <!-- HIRO MARKER -->
        <!-- ============================== -->

        <a-marker
            id="computerMarker"
            preset="hiro"

            emitevents="true"

            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >

            <!-- ================================= -->
            <!-- FRONT-FACING 3D COMPUTER -->
            <!-- ================================= -->

            <a-entity
                id="computer"
                position="0 0.05 0"
                rotation="0 0 0"
                scale="0.23 0.23 0.23"
            >

                <!-- ================================= -->
                <!-- MONITOR -->
                <!-- ================================= -->

                <!-- Monitor body -->
                <a-box
                    position="0 2.45 0"
                    width="4.6"
                    height="2.7"
                    depth="0.45"
                    color="#20252b"
                ></a-box>

                <!-- Screen -->
                <a-box
                    position="0 2.45 0.27"
                    width="4.15"
                    height="2.25"
                    depth="0.08"
                    color="#0c1720"
                ></a-box>

                <!-- Blue display -->
                <a-box
                    position="0 2.45 0.33"
                    width="3.75"
                    height="1.88"
                    depth="0.04"
                    color="#1976d2"
                ></a-box>

                <!-- Display highlight -->
                <a-box
                    position="-0.85 2.83 0.37"
                    width="1.3"
                    height="0.08"
                    depth="0.02"
                    color="#8eeaff"
                ></a-box>

                <!-- Monitor stand -->
                <a-box
                    position="0 1.05 0"
                    width="0.42"
                    height="1.15"
                    depth="0.42"
                    color="#292f35"
                ></a-box>

                <!-- Monitor base -->
                <a-box
                    position="0 0.47 0"
                    width="1.7"
                    height="0.16"
                    depth="0.8"
                    color="#292f35"
                ></a-box>


                <!-- ================================= -->
                <!-- SYSTEM UNIT -->
                <!-- ================================= -->

                <a-box
                    id="systemUnit"
                    class="clickable"

                    data-component="System Unit"

                    position="3.05 1.20 0"

                    width="1.75"
                    height="3.25"
                    depth="1.65"

                    color="#292e34"
                ></a-box>

                <!-- Front panel -->
                <a-box
                    position="3.05 1.20 0.85"

                    width="1.42"
                    height="2.95"
                    depth="0.08"

                    color="#15191d"
                ></a-box>

                <!-- Power button -->
                <a-cylinder
                    position="3.05 2.25 0.93"

                    radius="0.13"
                    height="0.05"

                    rotation="90 0 0"

                    color="#35e58a"
                ></a-cylinder>

                <!-- Drive bay -->
                <a-box
                    position="3.05 1.72 0.93"

                    width="0.82"
                    height="0.13"
                    depth="0.04"

                    color="#555d65"
                ></a-box>

                <!-- USB -->
                <a-box
                    position="2.75 1.48 0.93"
                    width="0.22"
                    height="0.08"
                    depth="0.04"
                    color="#777"
                ></a-box>

                <a-box
                    position="3.08 1.48 0.93"
                    width="0.22"
                    height="0.08"
                    depth="0.04"
                    color="#777"
                ></a-box>

                <!-- System Unit label -->
                <a-text
                    value="SYSTEM UNIT"
                    position="3.05 3.05 0.94"

                    align="center"

                    color="#35d9ff"

                    width="2.5"
                ></a-text>


                <!-- ================================= -->
                <!-- KEYBOARD -->
                <!-- ================================= -->

                <a-box
                    position="0 -0.02 1.20"

                    width="4.0"
                    height="0.15"
                    depth="1.0"

                    color="#24292e"
                ></a-box>

                <!-- Keyboard surface -->
                <a-box
                    position="0 0.07 1.20"

                    width="3.65"
                    height="0.04"
                    depth="0.78"

                    color="#3b4147"
                ></a-box>


                <!-- ================================= -->
                <!-- MOUSE -->
                <!-- ================================= -->

                <a-box
                    position="2.25 0.03 1.20"

                    width="0.60"
                    height="0.16"
                    depth="0.75"

                    color="#353b41"
                ></a-box>


                <!-- ================================= -->
                <!-- INTERNAL COMPONENTS -->
                <!-- ================================= -->

                <a-entity
                    id="internals"
                    visible="false"

                    position="3.05 1.20 0"
                >

                    <!-- Motherboard -->
                    <a-box
                        class="clickable"

                        data-component="Motherboard"

                        position="0 0 0.05"

                        width="1.35"
                        height="2.65"
                        depth="0.10"

                        color="#176b3a"
                    ></a-box>


                    <!-- CPU -->
                    <a-box
                        class="clickable"

                        data-component="CPU"

                        position="-0.25 0.45 0.20"

                        width="0.48"
                        height="0.48"
                        depth="0.18"

                        color="#999ea3"
                    ></a-box>


                    <!-- CPU FAN -->
                    <a-cylinder
                        class="clickable"

                        data-component="CPU Fan"

                        position="-0.25 0.45 0.34"

                        radius="0.25"
                        height="0.10"

                        color="#20252a"
                    ></a-cylinder>


                    <!-- RAM -->
                    <a-box
                        class="clickable"

                        data-component="RAM"

                        position="0.30 0.50 0.18"

                        width="0.13"
                        height="1.15"
                        depth="0.13"

                        color="#111"
                    ></a-box>

                    <a-box
                        position="0.30 0.50 0.27"

                        width="0.07"
                        height="0.95"
                        depth="0.03"

                        color="#29a957"
                    ></a-box>


                    <!-- GPU -->
                    <a-box
                        class="clickable"

                        data-component="GPU"

                        position="0 -0.40 0.22"

                        width="1.12"
                        height="0.34"
                        depth="0.38"

                        color="#343a40"
                    ></a-box>


                    <!-- SSD -->
                    <a-box
                        class="clickable"

                        data-component="SSD / Storage"

                        position="0.35 -0.05 0.25"

                        width="0.58"
                        height="0.30"
                        depth="0.14"

                        color="#c4c8cc"
                    ></a-box>


                    <!-- PSU -->
                    <a-box
                        class="clickable"

                        data-component="Power Supply Unit"

                        position="0 -0.92 0.20"

                        width="1.12"
                        height="0.50"
                        depth="0.78"

                        color="#464d54"
                    ></a-box>


                    <!-- Internal label -->
                    <a-text
                        value="MOTHERBOARD"
                        position="0 1.55 0.20"

                        align="center"

                        color="#ffffff"

                        width="2.3"
                    ></a-text>

                </a-entity>


                <!-- ================================= -->
                <!-- COMPUTER LABEL -->
                <!-- ================================= -->

                <a-text
                    value="3D COMPUTER"
                    position="0 4.0 0"

                    align="center"

                    color="#ffffff"

                    width="3.5"
                ></a-text>

            </a-entity>

        </a-marker>


        <!-- CAMERA -->
        <a-entity
            camera
            cursor="rayOrigin: mouse"
            raycaster="objects: .clickable"
        ></a-entity>

    </a-scene>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script>

        const marker =
            document.querySelector("#computerMarker");

        const computer =
            document.querySelector("#computer");

        const systemUnit =
            document.querySelector("#systemUnit");

        const internals =
            document.querySelector("#internals");

        const infoPanel =
            document.querySelector("#infoPanel");

        const componentTitle =
            document.querySelector("#componentTitle");

        const componentDescription =
            document.querySelector("#componentDescription");

        const closeInfo =
            document.querySelector("#closeInfo");


        /* =================================
           COMPONENT INFORMATION
        ================================= */

        const descriptions = {

            "System Unit":
                "The system unit is the main computer case. It contains the important internal components of a computer.",

            "Motherboard":
                "The motherboard is the main circuit board that connects the CPU, RAM, storage, GPU and other components.",

            "CPU":
                "The CPU or Central Processing Unit processes instructions and performs calculations.",

            "CPU Fan":
                "The CPU fan cools the processor and helps prevent overheating.",

            "RAM":
                "RAM or Random Access Memory temporarily stores data and programs currently being used.",

            "GPU":
                "The GPU or Graphics Processing Unit processes graphics, images and video.",

            "SSD / Storage":
                "SSD storage keeps the operating system, applications and files even when the computer is turned off.",

            "Power Supply Unit":
                "The PSU converts electrical power into the voltages required by the computer components."
        };


        /* =================================
           SYSTEM UNIT
        ================================= */

        systemUnit.addEventListener("click", function () {

            systemUnit.setAttribute(
                "visible",
                "false"
            );

            internals.setAttribute(
                "visible",
                "true"
            );

            componentTitle.innerText =
                "System Unit";

            componentDescription.innerText =
                descriptions["System Unit"];

            infoPanel.style.display =
                "block";
        });


        /* =================================
           INTERNAL COMPONENTS
        ================================= */

        document
            .querySelectorAll(".clickable")
            .forEach(component => {

                component.addEventListener(
                    "click",
                    function () {

                        const name =
                            this.getAttribute(
                                "data-component"
                            );

                        if (!name) return;

                        componentTitle.innerText =
                            name;

                        componentDescription.innerText =
                            descriptions[name];

                        infoPanel.style.display =
                            "block";
                    }
                );

            });


        /* =================================
           CLOSE INFO
        ================================= */

        closeInfo.addEventListener(
            "click",
            function () {

                infoPanel.style.display =
                    "none";

            }
        );


        /* =================================
           MARKER FOUND
        ================================= */

        marker.addEventListener(
            "markerFound",
            function () {

                computer.setAttribute(
                    "visible",
                    "true"
                );

                console.log(
                    "HIRO MARKER FOUND"
                );

            }
        );


        /* =================================
           MARKER LOST
        ================================= */

        marker.addEventListener(
            "markerLost",
            function () {

                console.log(
                    "HIRO MARKER LOST"
                );

            }
        );

    </script>

</body>
</html>
