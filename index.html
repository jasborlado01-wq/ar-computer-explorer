<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AR Computer Explorer</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #title {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            padding: 10px 18px;
            border-radius: 12px;

            font-size: 18px;
            font-weight: bold;

            text-align: center;
        }

        #infoPanel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            width: 85%;
            max-width: 400px;

            background: rgba(0, 0, 0, 0.85);
            color: white;

            padding: 15px;
            border-radius: 15px;

            z-index: 20;
            display: none;

            text-align: center;
        }

        #infoPanel h2 {
            margin-top: 0;
            color: #00ffff;
        }

        #closeInfo {
            margin-top: 10px;
            padding: 8px 18px;

            border: none;
            border-radius: 8px;

            background: #ffffff;
            color: black;

            font-weight: bold;
        }

        #instructions {
            position: fixed;
            bottom: 15px;
            right: 15px;

            z-index: 10;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            padding: 8px 12px;
            border-radius: 10px;

            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- TITLE -->
    <div id="title">
        🖥️ AR COMPUTER EXPLORER
    </div>

    <!-- INFO PANEL -->
    <div id="infoPanel">
        <h2 id="componentTitle">Computer Component</h2>

        <p id="componentDescription">
            Component information will appear here.
        </p>

        <button id="closeInfo">
            CLOSE
        </button>
    </div>

    <div id="instructions">
        Scan the HIRO marker 📷
    </div>


    <!-- AR SCENE -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"

        renderer="
            antialias: true;
            alpha: true;
            precision: highp;
        "

        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
            trackingMethod: best;
        "

        device-orientation-permission-ui="enabled: false"
    >

        <!-- CAMERA -->
        <a-entity camera></a-entity>


        <!-- HIRO MARKER -->
        <a-marker
            id="computerMarker"
            preset="hiro"
            emitevents="true"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >

            <!--
                MAIN COMPUTER GROUP

                IMPORTANT:
                The computer is centered at 0 0 0
                relative to the Hiro marker.
            -->
            <a-entity
                id="computer"
                position="0 0 0"
                rotation="0 0 0"
                scale="0.35 0.35 0.35"
            >

                <!-- ========================= -->
                <!-- MONITOR -->
                <!-- ========================= -->

                <!-- Monitor frame -->
                <a-box
                    position="0 1.75 0"
                    width="2.8"
                    height="1.7"
                    depth="0.18"
                    color="#222222"
                >
                </a-box>

                <!-- Monitor screen -->
                <a-box
                    position="0 1.75 0.11"
                    width="2.45"
                    height="1.35"
                    depth="0.03"
                    color="#1683d8"
                >
                </a-box>

                <!-- Screen glow -->
                <a-box
                    position="0 1.75 0.14"
                    width="2.20"
                    height="1.10"
                    depth="0.02"
                    color="#55c7ff"
                >
                </a-box>

                <!-- Monitor stand -->
                <a-box
                    position="0 0.75 0"
                    width="0.35"
                    height="0.75"
                    depth="0.35"
                    color="#333333"
                >
                </a-box>

                <!-- Monitor base -->
                <a-box
                    position="0 0.38 0"
                    width="1.25"
                    height="0.12"
                    depth="0.55"
                    color="#333333"
                >
                </a-box>


                <!-- ========================= -->
                <!-- SYSTEM UNIT / CASE -->
                <!-- ========================= -->

                <a-box
                    id="systemUnit"
                    class="component"
                    data-component="System Unit"
                    position="2.05 0.95 0"
                    width="1.35"
                    height="2.2"
                    depth="1.35"
                    color="#303030"
                >
                </a-box>

                <!-- Front panel -->
                <a-box
                    position="2.05 1.05 0.69"
                    width="1.05"
                    height="1.8"
                    depth="0.05"
                    color="#1a1a1a"
                >
                </a-box>

                <!-- Power button -->
                <a-cylinder
                    position="2.05 1.75 0.73"
                    rotation="90 0 0"
                    radius="0.10"
                    height="0.03"
                    color="#00ff88"
                >
                </a-cylinder>

                <!-- Drive bay -->
                <a-box
                    position="2.05 1.40 0.73"
                    width="0.65"
                    height="0.12"
                    depth="0.04"
                    color="#666666"
                >
                </a-box>


                <!-- ========================= -->
                <!-- KEYBOARD -->
                <!-- ========================= -->

                <a-box
                    position="0 -0.02 0.75"
                    width="2.7"
                    height="0.12"
                    depth="0.9"
                    color="#252525"
                >
                </a-box>


                <!-- ========================= -->
                <!-- MOUSE -->
                <!-- ========================= -->

                <a-box
                    position="1.65 0.05 0.75"
                    width="0.45"
                    height="0.12"
                    depth="0.60"
                    color="#444444"
                >
                </a-box>


                <!-- ========================= -->
                <!-- INTERNAL COMPONENTS -->
                <!-- ========================= -->

                <a-entity
                    id="internals"
                    visible="false"
                    position="2.05 0.95 0"
                >

                    <!-- Motherboard -->
                    <a-box
                        class="component"
                        data-component="Motherboard"
                        position="0 0 0.72"
                        width="1.0"
                        height="1.6"
                        depth="0.08"
                        color="#176b35"
                    >
                    </a-box>


                    <!-- CPU -->
                    <a-box
                        class="component"
                        data-component="CPU"
                        position="-0.20 0.35 0.82"
                        width="0.35"
                        height="0.35"
                        depth="0.12"
                        color="#777777"
                    >
                    </a-box>


                    <!-- CPU Fan -->
                    <a-cylinder
                        class="component"
                        data-component="CPU Fan"
                        position="-0.20 0.35 0.90"
                        radius="0.18"
                        height="0.08"
                        color="#222222"
                    >
                    </a-cylinder>


                    <!-- RAM -->
                    <a-box
                        class="component"
                        data-component="RAM"
                        position="0.25 0.35 0.82"
                        width="0.10"
                        height="0.85"
                        depth="0.08"
                        color="#111111"
                    >
                    </a-box>

                    <a-box
                        position="0.25 0.35 0.87"
                        width="0.05"
                        height="0.70"
                        depth="0.02"
                        color="#00aa66"
                    >
                    </a-box>


                    <!-- GPU -->
                    <a-box
                        class="component"
                        data-component="GPU"
                        position="0 -0.35 0.85"
                        width="0.80"
                        height="0.25"
                        depth="0.20"
                        color="#333333"
                    >
                    </a-box>


                    <!-- SSD -->
                    <a-box
                        class="component"
                        data-component="SSD / Storage"
                        position="0.35 -0.05 0.85"
                        width="0.40"
                        height="0.25"
                        depth="0.08"
                        color="#aaaaaa"
                    >
                    </a-box>


                    <!-- PSU -->
                    <a-box
                        class="component"
                        data-component="Power Supply Unit"
                        position="0 -0.70 0.85"
                        width="0.75"
                        height="0.40"
                        depth="0.65"
                        color="#444444"
                    >
                    </a-box>

                </a-entity>


                <!-- ========================= -->
                <!-- LABELS -->
                <!-- ========================= -->

                <a-text
                    value="SYSTEM UNIT"
                    position="2.05 2.25 0"
                    align="center"
                    color="#00ffff"
                    width="2.5"
                >
                </a-text>

                <a-text
                    value="COMPUTER"
                    position="0 2.85 0"
                    align="center"
                    color="#ffffff"
                    width="3"
                >
                </a-text>

            </a-entity>

        </a-marker>

    </a-scene>


    <!-- JAVASCRIPT -->
    <script>

        const marker = document.querySelector("#computerMarker");

        const computer = document.querySelector("#computer");

        const systemUnit = document.querySelector("#systemUnit");

        const internals = document.querySelector("#internals");

        const infoPanel = document.querySelector("#infoPanel");

        const componentTitle =
            document.querySelector("#componentTitle");

        const componentDescription =
            document.querySelector("#componentDescription");

        const closeInfo =
            document.querySelector("#closeInfo");


        // ==========================================
        // COMPONENT INFORMATION
        // ==========================================

        const descriptions = {

            "System Unit":
                "The system unit is the main computer case that contains important internal components.",

            "Motherboard":
                "The motherboard is the main circuit board that connects the CPU, RAM, storage, GPU and other components.",

            "CPU":
                "The CPU or Central Processing Unit processes instructions and performs calculations for the computer.",

            "CPU Fan":
                "The CPU fan helps cool the processor and prevents it from overheating.",

            "RAM":
                "RAM or Random Access Memory temporarily stores data and programs that the computer is currently using.",

            "GPU":
                "The GPU or Graphics Processing Unit processes images, videos and graphics.",

            "SSD / Storage":
                "SSD storage keeps files, applications and the operating system even when the computer is turned off.",

            "Power Supply Unit":
                "The PSU converts electrical power into the appropriate voltages needed by the computer components."
        };


        // ==========================================
        // OPEN COMPONENT INFORMATION
        // ==========================================

        document.querySelectorAll(".component")
            .forEach(component => {

                component.addEventListener("click", function () {

                    const name =
                        this.getAttribute("data-component");

                    componentTitle.innerText = name;

                    componentDescription.innerText =
                        descriptions[name] ||
                        "Information about this component.";

                    infoPanel.style.display = "block";
                });

            });


        // ==========================================
        // SYSTEM UNIT CLICK
        // ==========================================

        systemUnit.addEventListener("click", function () {

            this.setAttribute("visible", "false");

            internals.setAttribute("visible", "true");

            componentTitle.innerText =
                "System Unit";

            componentDescription.innerText =
                "The system unit contains the motherboard, CPU, RAM, GPU, storage and power supply.";

            infoPanel.style.display = "block";
        });


        // ==========================================
        // CLOSE INFO
        // ==========================================

        closeInfo.addEventListener("click", function () {

            infoPanel.style.display = "none";

        });


        // ==========================================
        // MARKER FOUND
        // ==========================================

        marker.addEventListener("markerFound", function () {

            console.log("HIRO MARKER FOUND!");

            computer.setAttribute(
                "visible",
                "true"
            );

        });


        // ==========================================
        // MARKER LOST
        // ==========================================

        marker.addEventListener("markerLost", function () {

            console.log("HIRO MARKER LOST");

        });

    </script>

</body>
</html>
