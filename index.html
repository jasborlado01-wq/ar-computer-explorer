<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AR Computer Explorer</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* TITLE */
        #title {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            width: 280px;
            padding: 12px 15px;

            background: rgba(0, 0, 0, 0.78);
            color: white;

            border-radius: 16px;

            text-align: center;
            font-size: 19px;
            font-weight: bold;
        }

        /* INSTRUCTION */
        #instruction {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            padding: 10px 16px;
            border-radius: 12px;

            font-size: 13px;
            text-align: center;
        }

        /* INFORMATION PANEL */
        #infoPanel {
            display: none;

            position: fixed;
            left: 50%;
            bottom: 75px;
            transform: translateX(-50%);

            width: 88%;
            max-width: 420px;

            z-index: 30;

            background: rgba(15, 20, 28, 0.95);
            color: white;

            border-radius: 18px;
            padding: 18px;

            text-align: center;

            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        #infoPanel h2 {
            margin: 0 0 10px 0;
            color: #4dd9ff;
        }

        #infoPanel p {
            line-height: 1.5;
            margin: 0;
        }

        #closeInfo {
            margin-top: 15px;

            border: none;
            border-radius: 10px;

            padding: 9px 22px;

            font-weight: bold;

            background: #4dd9ff;
            color: #111;
        }
    </style>
</head>


<body>

    <!-- TITLE -->
    <div id="title">
        🖥️ AR COMPUTER EXPLORER
    </div>

    <!-- INFORMATION PANEL -->
    <div id="infoPanel">

        <h2 id="componentTitle">
            Computer Component
        </h2>

        <p id="componentDescription">
            Component information
        </p>

        <button id="closeInfo">
            CLOSE
        </button>

    </div>

    <!-- INSTRUCTION -->
    <div id="instruction">
        📷 Scan the HIRO marker
    </div>


    <!-- ============================= -->
    <!-- AR SCENE -->
    <!-- ============================= -->

    <a-scene
        embedded
        vr-mode-ui="enabled: false"

        renderer="
            antialias: true;
            alpha: true;
            precision: highp;
        "

        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
            trackingMethod: best;
        "

        device-orientation-permission-ui="enabled: false"
    >


        <!-- ============================= -->
        <!-- HIRO MARKER -->
        <!-- ============================= -->

        <a-marker
            id="computerMarker"
            preset="hiro"

            emitevents="true"

            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >


            <!-- ================================= -->
            <!-- ENTIRE COMPUTER -->
            <!-- ================================= -->

            <a-entity
                id="computer"
                position="0 0.05 0"
                rotation="0 0 0"
                scale="0.22 0.22 0.22"
            >


                <!-- ================================= -->
                <!-- MONITOR -->
                <!-- ================================= -->

                <!-- Monitor outer frame -->
                <a-box
                    position="0 2.55 0"
                    width="4.4"
                    height="2.6"
                    depth="0.25"
                    color="#1b1f24"
                >
                </a-box>

                <!-- Monitor screen -->
                <a-box
                    position="0 2.55 0.15"
                    width="3.95"
                    height="2.15"
                    depth="0.08"
                    color="#111820"
                >
                </a-box>

                <!-- Screen display -->
                <a-box
                    position="0 2.55 0.20"
                    width="3.55"
                    height="1.75"
                    depth="0.04"
                    color="#1976d2"
                >
                </a-box>

                <!-- Screen shine -->
                <a-box
                    position="-0.7 2.85 0.23"
                    width="1.4"
                    height="0.12"
                    depth="0.02"
                    color="#62d8ff"
                >
                </a-box>

                <!-- Monitor stand -->
                <a-box
                    position="0 1.15 0"
                    width="0.38"
                    height="1.1"
                    depth="0.35"
                    color="#252a30"
                >
                </a-box>

                <!-- Monitor base -->
                <a-box
                    position="0 0.58 0"
                    width="1.7"
                    height="0.16"
                    depth="0.75"
                    color="#252a30"
                >
                </a-box>


                <!-- ================================= -->
                <!-- SYSTEM UNIT -->
                <!-- ================================= -->

                <a-box
                    id="systemUnit"
                    class="clickable"
                    data-component="System Unit"

                    position="3.05 1.05 0"

                    width="1.65"
                    height="3.0"
                    depth="1.65"

                    color="#252a30"
                >
                </a-box>


                <!-- System unit front -->
                <a-box
                    position="3.05 1.05 0.86"

                    width="1.35"
                    height="2.7"
                    depth="0.08"

                    color="#161a1e"
                >
                </a-box>


                <!-- Power button -->
                <a-cylinder
                    position="3.05 2.10 0.92"

                    radius="0.12"
                    height="0.05"

                    rotation="90 0 0"

                    color="#36e58a"
                >
                </a-cylinder>


                <!-- USB ports -->
                <a-box
                    position="2.72 1.70 0.92"
                    width="0.25"
                    height="0.07"
                    depth="0.04"
                    color="#777777"
                >
                </a-box>

                <a-box
                    position="3.08 1.70 0.92"
                    width="0.25"
                    height="0.07"
                    depth="0.04"
                    color="#777777"
                >
                </a-box>


                <!-- Drive slot -->
                <a-box
                    position="3.05 1.38 0.92"
                    width="0.75"
                    height="0.12"
                    depth="0.04"
                    color="#555b61"
                >
                </a-box>


                <!-- SYSTEM UNIT LABEL -->
                <a-text
                    value="SYSTEM UNIT"
                    position="3.05 3.0 0.92"

                    align="center"

                    color="#4dd9ff"

                    width="2.6"
                >
                </a-text>


                <!-- ================================= -->
                <!-- KEYBOARD -->
                <!-- ================================= -->

                <a-box
                    position="0 -0.05 1.25"

                    width="3.9"
                    height="0.16"
                    depth="1.15"

                    color="#20252a"
                >
                </a-box>

                <!-- Keyboard top -->
                <a-box
                    position="0 0.05 1.25"

                    width="3.55"
                    height="0.04"
                    depth="0.85"

                    color="#343a40"
                >
                </a-box>


                <!-- ================================= -->
                <!-- MOUSE -->
                <!-- ================================= -->

                <a-box
                    position="2.25 0.03 1.25"

                    width="0.65"
                    height="0.18"
                    depth="0.85"

                    color="#343a40"
                >
                </a-box>


                <!-- ================================= -->
                <!-- INTERNAL COMPUTER PARTS -->
                <!-- ================================= -->

                <a-entity
                    id="internals"
                    visible="false"

                    position="3.05 1.05 0"
                >


                    <!-- Motherboard -->
                    <a-box
                        class="clickable"
                        data-component="Motherboard"

                        position="0 0 0"

                        width="1.25"
                        height="2.35"
                        depth="0.08"

                        color="#176b3a"
                    >
                    </a-box>


                    <!-- CPU -->
                    <a-box
                        class="clickable"
                        data-component="CPU"

                        position="-0.25 0.35 0.15"

                        width="0.45"
                        height="0.45"
                        depth="0.18"

                        color="#8b8f94"
                    >
                    </a-box>


                    <!-- CPU fan -->
                    <a-cylinder
                        class="clickable"
                        data-component="CPU Fan"

                        position="-0.25 0.35 0.28"

                        radius="0.24"
                        height="0.10"

                        color="#20252a"
                    >
                    </a-cylinder>


                    <!-- RAM -->
                    <a-box
                        class="clickable"
                        data-component="RAM"

                        position="0.25 0.45 0.15"

                        width="0.13"
                        height="1.05"
                        depth="0.12"

                        color="#111111"
                    >
                    </a-box>

                    <a-box
                        position="0.25 0.45 0.23"

                        width="0.07"
                        height="0.85"
                        depth="0.03"

                        color="#28a745"
                    >
                    </a-box>


                    <!-- GPU -->
                    <a-box
                        class="clickable"
                        data-component="GPU"

                        position="0 -0.45 0.18"

                        width="1.05"
                        height="0.32"
                        depth="0.35"

                        color="#343a40"
                    >
                    </a-box>


                    <!-- SSD -->
                    <a-box
                        class="clickable"
                        data-component="SSD / Storage"

                        position="0.30 -0.05 0.22"

                        width="0.55"
                        height="0.30"
                        depth="0.12"

                        color="#bfc4c8"
                    >
                    </a-box>


                    <!-- PSU -->
                    <a-box
                        class="clickable"
                        data-component="Power Supply Unit"

                        position="0 -0.82 0.15"

                        width="1.05"
                        height="0.48"
                        depth="0.75"

                        color="#444a50"
                    >
                    </a-box>


                    <!-- INTERNAL LABEL -->
                    <a-text
                        value="MOTHERBOARD"
                        position="0 1.45 0.10"

                        align="center"

                        color="#ffffff"

                        width="2.4"
                    >
                    </a-text>

                </a-entity>


                <!-- ================================= -->
                <!-- COMPUTER LABEL -->
                <!-- ================================= -->

                <a-text
                    value="COMPUTER"
                    position="0 4.0 0"

                    align="center"

                    color="#ffffff"

                    width="4"
                >
                </a-text>


            </a-entity>

        </a-marker>


        <!-- CAMERA -->
        <a-entity camera></a-entity>

    </a-scene>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script>

        const computer =
            document.querySelector("#computer");

        const marker =
            document.querySelector("#computerMarker");

        const systemUnit =
            document.querySelector("#systemUnit");

        const internals =
            document.querySelector("#internals");

        const infoPanel =
            document.querySelector("#infoPanel");

        const componentTitle =
            document.querySelector("#componentTitle");

        const componentDescription =
            document.querySelector("#componentDescription");

        const closeInfo =
            document.querySelector("#closeInfo");


        /* =====================================
           COMPONENT INFORMATION
        ===================================== */

        const descriptions = {

            "System Unit":
                "The system unit is the main case of a computer. It contains the major internal components that allow the computer to operate.",

            "Motherboard":
                "The motherboard is the main circuit board. It connects the CPU, RAM, storage, GPU and other components.",

            "CPU":
                "The CPU, or Central Processing Unit, executes instructions and performs calculations needed by the computer.",

            "CPU Fan":
                "The CPU fan removes heat from the processor and helps prevent overheating.",

            "RAM":
                "RAM, or Random Access Memory, temporarily stores data and programs currently being used by the computer.",

            "GPU":
                "The GPU, or Graphics Processing Unit, processes graphics, images and video.",

            "SSD / Storage":
                "An SSD stores the operating system, applications and personal files even when the computer is turned off.",

            "Power Supply Unit":
                "The Power Supply Unit, or PSU, converts electrical power into the voltages required by the computer's components."
        };


        /* =====================================
           SYSTEM UNIT CLICK
        ===================================== */

        systemUnit.addEventListener("click", function () {

            /*
                Hide the outer case
                and reveal the internal components.
            */

            systemUnit.setAttribute(
                "visible",
                "false"
            );

            internals.setAttribute(
                "visible",
                "true"
            );

            componentTitle.innerText =
                "System Unit";

            componentDescription.innerText =
                descriptions["System Unit"];

            infoPanel.style.display =
                "block";
        });


        /* =====================================
           INTERNAL COMPONENT CLICK
        ===================================== */

        document
            .querySelectorAll(".clickable")
            .forEach(component => {

                component.addEventListener(
                    "click",
                    function () {

                        const name =
                            this.getAttribute(
                                "data-component"
                            );

                        if (!name) return;

                        componentTitle.innerText =
                            name;

                        componentDescription.innerText =
                            descriptions[name] ||
                            "Information about this computer component.";

                        infoPanel.style.display =
                            "block";
                    }
                );

            });


        /* =====================================
           CLOSE INFO
        ===================================== */

        closeInfo.addEventListener(
            "click",
            function () {

                infoPanel.style.display =
                    "none";

            }
        );


        /* =====================================
           MARKER DETECTED
        ===================================== */

        marker.addEventListener(
            "markerFound",
            function () {

                console.log(
                    "HIRO MARKER FOUND"
                );

                computer.setAttribute(
                    "visible",
                    "true"
                );

            }
        );


        /* =====================================
           MARKER LOST
        ===================================== */

        marker.addEventListener(
            "markerLost",
            function () {

                console.log(
                    "HIRO MARKER LOST"
                );

            }
        );

    </script>

</body>
</html>
